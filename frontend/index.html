<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DocConvert Studio is a fast document conversion workspace for PDFs, Office files, spreadsheets, images, and text formats." />
  <meta name="theme-color" content="#0f172a" />
  <title>DocConvert Studio — Business Document Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <a href="#main-content" class="sr-only">Skip to content</a>

  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="sidebar-header">
      <div class="logo" aria-label="DocConvert">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M11 8h12l6 6v18H11V8Z" fill="currentColor" opacity=".18"/>
          <path d="M23 8v7h7" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M15 18h10M15 23h10M15 28h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M8 12v20h21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-copy">
          <span class="logo-text">DocConvert</span>
          <span class="logo-tagline">Studio</span>
        </span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#/" class="nav-item" data-route="/" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Upload &amp; Convert</span>
      </a>
      <a href="#/jobs" class="nav-item" data-route="/jobs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        <span>Jobs</span>
        <span class="badge" id="active-jobs-badge" style="display:none">0</span>
      </a>
      <a href="#/formats" class="nav-item" data-route="/formats">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Formats</span>
      </a>
    </nav>

    <div class="sidebar-promo">
      <span class="promo-kicker">Pro ready</span>
      <strong>Built for teams, agencies, and client delivery.</strong>
      <p>Premium conversion packs, partner placements, and usage tiers can fit here later.</p>
    </div>

    <div class="sidebar-footer">
      <div class="api-status" id="api-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Switch to light mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </aside>

  <header class="mobile-header">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M11 8h12l6 6v18H11V8Z" fill="currentColor" opacity=".18"/><path d="M23 8v7h7" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M15 18h10M15 23h10M15 28h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8 12v20h21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="logo-copy">
        <span class="logo-text">DocConvert</span>
        <span class="logo-tagline">Studio</span>
      </span>
    </div>
  </header>

  <main class="main-content" id="main-content">
    <div id="app-root"></div>
  </main>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
