version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: src/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - conversion_data:/tmp/doc_converter
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    volumes:
      - conversion_data:/tmp/doc_converter
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      replicas: 2  # Scale workers horizontally

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  flower:
    image: mher/flower:2.0
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  conversion_data:
  redis_data:
